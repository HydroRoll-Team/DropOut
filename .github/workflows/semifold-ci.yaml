name: Semifold CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: 1
  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

permissions:
  id-token: write
  attestations: write
  contents: write
  pull-requests: write

jobs:
  build-tauri:
    name: Build on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - platform: "ubuntu-22.04"
            name: "Linux x86_64 (GNU)"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu"
          - platform: "ubuntu-22.04-arm"
            name: "Linux arm64 (GNU)"
            target: "aarch64-unknown-linux-gnu"
            args: "--target aarch64-unknown-linux-gnu"
          # macOS
          - platform: "macos-latest"
            name: "macOS x86_64"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "macos-latest"
            name: "macOS arm64"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          # Windows
          - platform: "windows-latest"
            name: "Windows x86_64 (MSVC)"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
          - platform: "windows-11-arm"
            name: "Windows arm64 (MSVC)"
            target: "aarch64-pc-windows-msvc"
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          sudo tee /etc/apt/apt.conf.d/99github-actions-retries >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::ForceIPv4 "true";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

          packages="libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 rpm2cpio cpio"
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y $packages && break
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sudo apt-get clean
            sleep $((attempt * 15))
          done

      - name: Install Musl Tools (for musl target)
        if: matrix.install-musl == true
        run: |
          sudo apt-get install -y musl-tools musl-dev
          sudo apt-get install -y pkg-config

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ runner.os != 'Windows' && 'pnpm' || '' }}
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Root Node.js Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Setup appimagetool (Linux)
        if: startsWith(matrix.platform, 'ubuntu') && !startsWith(matrix.platform, 'macos') && !startsWith(matrix.platform, 'windows')
        run: |
          ARCH=$(uname -m)
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x "appimagetool-${ARCH}.AppImage"
          if command -v sudo >/dev/null 2>&1; then
            sudo mv "appimagetool-${ARCH}.AppImage" /usr/local/bin/appimagetool
          else
            mv "appimagetool-${ARCH}.AppImage" /usr/local/bin/appimagetool
          fi

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        with:
          args: ${{ matrix.args }}

      - name: Fix AppImage for Wayland (Linux)
        if: startsWith(matrix.platform, 'ubuntu') && !startsWith(matrix.platform, 'macos') && !startsWith(matrix.platform, 'windows')
        run: |
          # Locate the generated AppImage
          APPIMAGE=$(find bundle -name "*.AppImage" -type f | head -1)
          echo "Found AppImage: $APPIMAGE"

          if [ -n "$APPIMAGE" ]; then
            # backup original AppImage
            cp "$APPIMAGE" "${APPIMAGE}.backup"

            # extract AppImage
            "$APPIMAGE" --appimage-extract

            # Fix GTK hook, remove forced X11
            if [ -f squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh ]; then
              sed -i 's/^export GDK_BACKEND=x11.*$/# export GDK_BACKEND=x11  # Disabled for Wayland compatibility/' squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
              echo "Successfully patched GTK hook for Wayland compatibility"
            fi

            # Repack AppImage
            appimagetool squashfs-root "$APPIMAGE"
            rm -rf squashfs-root
          fi
        working-directory: target/release

      - name: Smoke isolated install (Linux)
        if: runner.os == 'Linux'
        run: scripts/smoke-install-linux.sh "${{ matrix.target }}"

      - name: Smoke isolated install (macOS)
        if: runner.os == 'macOS'
        run: scripts/smoke-install-macos.sh "${{ matrix.target }}"

      - name: Smoke isolated install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-install-windows.ps1 -Target "${{ matrix.target }}"

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.target }}-artifacts
          path: |
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          retention-days: 7

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.target }}-artifacts
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 1

      - name: Upload Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.target }}-artifacts
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
          retention-days: 1

  build-linux-musl:
    name: Build on Linux x86_64 (Musl)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Verify distribution release contracts
        run: |
          scripts/test-linux-musl-release.sh
          scripts/test-release-provenance.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and verify Alpine musl artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/linux-musl.Dockerfile
          target: artifact
          outputs: type=local,dest=artifacts/linux-musl
          cache-from: type=gha,scope=linux-musl
          cache-to: type=gha,mode=max,scope=linux-musl

      - name: Upload musl artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64-unknown-linux-musl-artifacts
          path: artifacts/linux-musl/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-tauri, build-linux-musl]
    outputs:
      version: ${{ steps.semifold.outputs['semifold-version'] }}
      publish: ${{ steps.semifold.outputs['semifold-publish'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Semifold
        uses: noctisynth/setup-semifold@main
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: Install Node.js Dependencies
        run: pnpm install
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: "!*.dockerbuild"
          path: artifacts/
          merge-multiple: true
      - name: List artifacts
        run: ls -R artifacts/
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: artifacts/**/*
      - name: Semifold CI
        id: semifold
        run: semifold ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Remove `NODE_AUTH_TOKEN` if you want to use OIDC
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  publish-aur:
    name: Publish AUR
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check matching GitHub release
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(jq -re '.version' src-tauri/tauri.conf.json)
          if output=$(gh release view "dropout-v$version" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            if printf '%s\n' "$output" | grep -qi 'not found'; then
              echo "published=false" >> "$GITHUB_OUTPUT"
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          fi
      - name: Install pnpm
        if: steps.release_check.outputs.published == 'true'
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        if: steps.release_check.outputs.published == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
      - name: Install Makepkg
        if: steps.release_check.outputs.published == 'true'
        run: sudo apt-get update && sudo apt-get install -y makepkg pacman
      - name: Install Node.js Dependencies
        if: steps.release_check.outputs.published == 'true'
        run: pnpm install --frozen-lockfile
      - name: Download Linux build artifacts
        if: steps.release_check.outputs.published == 'true'
        uses: actions/download-artifact@v6
        with:
          pattern: linux-*-artifacts
          path: artifacts/
          merge-multiple: true
      - name: Publish AUR package
        if: steps.release_check.outputs.published == 'true'
        run: pnpm exec tsx scripts/release-aur.ts
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
