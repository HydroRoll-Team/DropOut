name: UI Checker

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".github/workflows/check.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - run: pnpm -C packages/ui --lockfile-dir "${{ github.workspace }}" install --frozen-lockfile

      - name: Lint UI
        run: pnpm biome ci
        working-directory: packages/ui

      - name: Run UI unit tests
        run: pnpm -C packages/ui test:unit

      - name: Build UI
        run: pnpm -C packages/ui build

      - name: Install Playwright browser
        run: pnpm -C packages/ui exec playwright install --with-deps chromium

      - name: Run UI fixture regression suite
        run: pnpm -C packages/ui test:ui

      - name: Upload Linux screenshot candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot-candidates
          path: packages/ui/test-results/**/*-actual.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload UI regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-diagnostics
          path: packages/ui/test-results
          retention-days: 7
