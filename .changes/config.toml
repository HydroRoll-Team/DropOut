[branches]
base = "main"
release = "release"

[tags]
chore = "Chores"
feat = "New Features"
fix = "Bug Fixes"
perf = "Performance Improvements"
refactor = "Refactors"

[changelog]
template = """
## v{{ package.next_version }}

{% for section in sections %}### {{ section.name }}

{% for entry in section.entries %}{{ entry.content }}{% if not loop.last %}
{% endif %}{% endfor %}{% if not loop.last or dependency_updates %}

{% endif %}{% endfor %}{% if dependency_updates %}### Dependencies

{% for dependency in dependency_updates %}- Update {{ dependency.package }} to {{ dependency.next_version }}.{% if not loop.last %}
{% endif %}{% endfor %}{% endif %}"""
changeset-template = """
- {% if changeset.commit and changeset.commit.web_url %}[`{{ changeset.commit.short_sha }}`]({{ changeset.commit.web_url }}): {% endif %}{{ changeset.summary_paragraphs[0] | join(" ") }}{% if changeset.pull_request %} {% if changeset.pull_request.web_url %}([#{{ changeset.pull_request.number }}]({{ changeset.pull_request.web_url }}){% else %}(#{{ changeset.pull_request.number }}{% endif %}{% if changeset.pull_request.author %} by @{{ changeset.pull_request.author }}{% endif %}){% endif %}{% for paragraph in changeset.summary_paragraphs %}{% if not loop.first %}

    {{ paragraph | join(" ") }}{% endif %}{% endfor %}{% if changeset.summary_paragraphs | length > 1 %}
{% endif %}"""

[packages."@dropout/workspace"]
path = "."
resolver = "nodejs"

[packages."@dropout/ui"]
path = "packages/ui"
resolver = "nodejs"
channel = "rc"

[packages."@dropout/docs"]
path = "packages/docs"
resolver = "nodejs"
channel = "rc"

[packages.dropout]
path = "src-tauri"
resolver = "rust"
assets = ["artifacts/**/*"]
channel = "rc"

[packages.dropout-macros]
path = "crates/macros"
resolver = "rust"
channel = "rc"

[resolver.rust.pre-check]
type = "http"
url = "https://crates.io/api/v1/crates/{{ package.name }}/{{ package.version }}"
retry = [
    2,
    5,
    15,
    30,
]

[[resolver.rust.post-version]]
command = "cargo"
args = ["generate-lockfile"]
dry-run = true

[[resolver.rust.post-version]]
command = "bash"
args = ["-lc", "root=$(git rev-parse --show-toplevel) && pnpm --dir \"$root\" bump-tauri"]

[resolver.nodejs.pre-check]
type = "http"
url = "https://registry.npmjs.org/{{ package.name }}/{{ package.version }}"
retry = [
    2,
    5,
    15,
    30,
]
